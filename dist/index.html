<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Devil</title>
<!-- the heart, in its own light, on the void: an inline SVG so the host never has to serve a favicon file -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0620'/%3E%3Cpath d='M16 27 C8 21 4 17 4 12 a6 6 0 0 1 12-2 a6 6 0 0 1 12 2 c0 5-4 9-12 15z' fill='%239fe8ff'/%3E%3Cpath d='M16 27 C8 21 4 17 4 12 a6 6 0 0 1 12-2 a6 6 0 0 1 12 2 c0 5-4 9-12 15z' fill='none' stroke='%23fdf8f0' stroke-width='1.2' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* the palette. game.js reads these once at start. */
  --void:#0a0620;        /* deep indigo-black */
  --midnight:#1b1046;    /* violet mist above the floor line */
  --heart:#9fe8ff;       /* cyan glass, white core */
  --claw:#c2140e;        /* dark muscled red, unlit */
  --bone:#fdf8f0;
  --ember:#ff2a00;
  --sulfur:#ffc321;
  --ash:#c79a8f;
  --title:#ff5a1f;       /* red-orange display type */
  --plastic:#cfc9b8;     /* the monitor */
  --plastic-dark:#8f887a;
  --s:1;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(120% 70% at 50% 118%, rgba(27,16,70,.9), rgba(27,16,70,0) 60%),
    var(--void);
  color:var(--bone);
  font-family:"Press Start 2P","Courier New",ui-monospace,monospace;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:6px}
/* the touch controls: a layer over the whole screen, drawn by game.js */
#ctl{position:absolute;inset:0;pointer-events:none;z-index:5;display:none}
body.touch #ctl{display:block}
/* when the aspect ratio leaves a band below the playfield, the playfield sits at the top and the controls take the band */
body.band #wrap{align-items:flex-start}

/* ---- the monitor: beige-grey plastic, a curved screen, a power LED ---- */
#monitor{
  position:relative;
  padding:calc(24px * var(--s)) calc(26px * var(--s)) calc(44px * var(--s));
  border-radius:calc(18px * var(--s));
  background:
    linear-gradient(160deg, #e2ddcd 0%, var(--plastic) 45%, #b5ae9c 100%);
  box-shadow:
    inset 0 calc(2px * var(--s)) 0 rgba(255,255,255,.55),
    inset 0 calc(-3px * var(--s)) 0 rgba(0,0,0,.25),
    0 calc(18px * var(--s)) calc(40px * var(--s)) rgba(0,0,0,.6);
}
#monitor::before{ /* the recessed rim around the glass */
  content:"";position:absolute;pointer-events:none;
  inset:calc(16px * var(--s)) calc(18px * var(--s)) calc(36px * var(--s));
  border-radius:calc(16px * var(--s));
  background:linear-gradient(180deg, #6d675b, #3c3830 60%, #55503f);
  box-shadow:inset 0 calc(2px * var(--s)) calc(6px * var(--s)) rgba(0,0,0,.7);
}
#led{
  position:absolute;right:calc(30px * var(--s));bottom:calc(16px * var(--s));
  width:calc(7px * var(--s));height:calc(7px * var(--s));border-radius:50%;
  background:#48ff6a;box-shadow:0 0 calc(6px * var(--s)) #48ff6a, 0 0 calc(14px * var(--s)) rgba(72,255,106,.5);
}
#badge{
  position:absolute;left:calc(32px * var(--s));bottom:calc(13px * var(--s));
  font-size:calc(6px * var(--s));color:var(--plastic-dark);letter-spacing:1px;
  text-shadow:0 1px 0 rgba(255,255,255,.5);
}
#stage{
  position:relative;line-height:0;
  border-radius:calc(14px * var(--s));
  overflow:hidden;
  background:#000;
}
canvas{display:block}
/* scanlines and the tube's vignette, inside the glass */
#stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,.30) 0 1px, rgba(0,0,0,0) 1px 3px),
    radial-gradient(130% 100% at 50% 50%, rgba(0,0,0,0) 52%, rgba(0,0,0,.72) 100%);
  /* plain alpha: black over the picture is the same result as a multiply,
     and it spares the compositor a blend layer every frame */
}
/* small screens: no bezel, the glass fills the screen */
body.bare #wrap{padding:0}
body.bare #monitor{padding:0;border-radius:0;background:none;box-shadow:none}
body.bare #monitor::before,body.bare #led,body.bare #badge{display:none}
body.bare #stage{border-radius:0}
/* on touch screens both bottom corners belong to the controls; the mute sits between them */
body.touch #mute{position:fixed;right:auto;left:50%;transform:translateX(-50%);bottom:calc(8px + env(safe-area-inset-bottom,0px))}
/* the glass itself: a soft reflection that sells the barrel curve */
#stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
    radial-gradient(60% 40% at 18% 8%, rgba(255,255,255,.10), rgba(255,255,255,0) 70%),
    radial-gradient(120% 80% at 50% 50%, rgba(255,255,255,0) 70%, rgba(180,200,255,.06) 100%);
}

/* ---- overlay screens ---- */
.screen{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  gap:calc(14px * var(--s));padding:calc(22px * var(--s));
  background:rgba(10,6,32,.72);z-index:2;line-height:1.7;
}
.screen[hidden]{display:none}
/* after he takes it: the panel sits in the empty lower third, off the picture */
#scr-over.low{justify-content:flex-end;padding-bottom:calc(56px * var(--s));
  background:linear-gradient(to top, rgba(10,6,32,.9) 32%, rgba(10,6,32,0) 60%)}
#scr-title{justify-content:flex-start;padding-top:calc(54px * var(--s));background:rgba(10,6,32,.35)}
.banner{
  position:absolute;top:0;left:0;right:0;
  padding:calc(7px * var(--s)) 0;
  background:linear-gradient(180deg, #1a0a10, #05020a);
  border-bottom:1px solid rgba(255,90,31,.5);
  font-size:calc(6px * var(--s));letter-spacing:calc(3px * var(--s));color:var(--title);
  text-shadow:0 0 calc(6px * var(--s)) rgba(255,90,31,.6);
}
.title{
  margin-top:calc(10px * var(--s));
  font-size:calc(26px * var(--s));line-height:1.35;color:var(--title);letter-spacing:1px;
  text-shadow:
    calc(3px * var(--s)) calc(3px * var(--s)) 0 #6e1208,
    0 0 calc(10px * var(--s)) rgba(159,232,255,.9),
    0 0 calc(28px * var(--s)) rgba(159,232,255,.55),
    0 0 calc(60px * var(--s)) rgba(159,232,255,.3);
}
.sub{font-size:calc(7px * var(--s));color:#c9c1e8;line-height:2.1;
  text-shadow:0 0 calc(6px * var(--s)) rgba(10,6,32,.9)}
.why{color:var(--bone);opacity:.85}
.big{font-size:calc(13px * var(--s));color:var(--sulfur);
  text-shadow:0 0 calc(12px * var(--s)) rgba(255,195,33,.7)}
.lose{color:var(--ember);text-shadow:0 0 calc(12px * var(--s)) rgba(255,42,0,.8)}
.stat{font-size:calc(8px * var(--s));color:var(--bone)}
.blink{font-size:calc(8px * var(--s));color:var(--heart);animation:bl 1.1s steps(1,end) infinite;
  text-shadow:0 0 calc(8px * var(--s)) rgba(159,232,255,.7)}
@keyframes bl{0%,55%{opacity:1}56%,100%{opacity:0}}
#mute{
  position:absolute;z-index:3;right:calc(6px * var(--s));bottom:calc(6px * var(--s));
  background:transparent;border:1px solid rgba(159,232,255,.3);color:rgba(159,232,255,.7);
  font-family:inherit;font-size:calc(7px * var(--s));padding:calc(5px * var(--s)) calc(7px * var(--s));
  border-radius:2px;cursor:pointer;
}
#mute:hover,#mute:focus-visible{color:var(--heart);border-color:rgba(159,232,255,.7)}
:focus-visible{outline:2px solid var(--heart);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
</style>
</head>
<body>
<div id="wrap">
  <div id="monitor">
    <div id="stage">
      <canvas id="c" aria-label="Beat the Devil arcade game"></canvas>

      <div class="screen" id="scr-title">
        <div class="banner">AN ARCADE NIGHTMARE</div>
        <div class="title">BEAT<br>THE DEVIL</div>
        <div class="sub" id="tip">Arrow keys or A / D to move<br>Hold space to fire<br><br>Survive the pitchforks and the fire.<br>Then put a bolt through<br>each of his eyes.</div>
        <div class="blink" id="start-hint">Press space to start</div>
        <div class="stat" id="hi-title"></div>
      </div>

      <div class="screen" id="scr-over" hidden>
        <div class="big lose">HE TOOK IT</div>
        <div class="sub why" id="over-why"></div>
        <div class="stat" id="over-score"></div>
        <div class="stat" id="over-hi"></div>
        <div class="blink" id="over-hint">Press space to try again</div>
      </div>

      <div class="screen" id="scr-win" hidden>
        <div class="big">YOU BEAT<br>THE DEVIL</div>
        <div class="sub why" id="win-why"></div>
        <div class="stat" id="win-score"></div>
        <div class="stat" id="win-hi"></div>
        <div class="blink" id="win-hint">Press space to play again</div>
      </div>

      <button id="mute" type="button">Sound on</button>
    </div>
    <div id="badge">BTD</div>
    <div id="led"></div>
  </div>
  <canvas id="ctl" aria-hidden="true"></canvas>
</div>

<script>
// audio.js — Web Audio synthesis for Beat the Devil.
// Sound effects and a chiptune sequencer that is slaved to the game's
// heartbeat: the game calls music.beat() on every "lub" and the sequencer
// schedules one beat's worth of steps from that moment. Everything is
// generated at runtime; there are no audio assets. Exposes window.BTD_AUDIO.
(function(){
"use strict";

var actx = null, master = null, sfxBus = null, musicBus = null, noiseBuf = null;
var heartBus = null, heartFilter = null;   // the heartbeat has its own bus so it can be muffled
var muted = false;
var MASTER_GAIN = 0.28, MUSIC_GAIN = 0.5, HEART_GAIN = 1.3;

function ctx(){
  if (!actx){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      actx = new AC();
      var comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 5;
      comp.attack.value = 0.004; comp.release.value = 0.18;
      comp.connect(actx.destination);
      master = actx.createGain();
      master.gain.value = muted ? 0 : MASTER_GAIN;
      master.connect(comp);
      sfxBus = actx.createGain(); sfxBus.gain.value = 1;   sfxBus.connect(master);
      musicBus = actx.createGain(); musicBus.gain.value = MUSIC_GAIN; musicBus.connect(master);
      heartFilter = actx.createBiquadFilter(); heartFilter.type = 'lowpass'; heartFilter.frequency.value = 20000;
      heartBus = actx.createGain(); heartBus.gain.value = HEART_GAIN; heartBus.connect(heartFilter); heartFilter.connect(master);
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i=0;i<d.length;i++) d[i] = Math.random()*2 - 1;
    } catch(e){ return null; }
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function running(){ return actx && actx.state === 'running'; }

// ---------- primitives ----------
// tone({freq, dur, vol, type, slide, attack, filter, q, detune, t, bus})
function tone(o){
  var a = ctx(); if (!a) return;
  var t = o.t == null ? a.currentTime : o.t;
  var osc = a.createOscillator();
  osc.type = o.type || 'square';
  osc.frequency.setValueAtTime(o.freq, t);
  if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.slide), t + o.dur);
  if (o.detune) osc.detune.value = o.detune;
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(o.vol == null ? 0.3 : o.vol, t + (o.attack || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  var node = osc;
  if (o.filter){
    var f = a.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = o.filter; f.Q.value = o.q || 0.7;
    osc.connect(f); node = f;
  }
  node.connect(g); g.connect(o.bus || sfxBus);
  osc.start(t); osc.stop(t + o.dur + 0.05);
}
// noise({dur, vol, type, freq, q, slide, attack, t, bus})
function noise(o){
  var a = ctx(); if (!a) return;
  var t = o.t == null ? a.currentTime : o.t;
  var src = a.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  var f = a.createBiquadFilter();
  f.type = o.type || 'lowpass'; f.frequency.value = o.freq || 1400;
  if (o.q) f.Q.value = o.q;
  if (o.slide) f.frequency.exponentialRampToValueAtTime(o.slide, t + o.dur);
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(o.vol == null ? 0.3 : o.vol, t + (o.attack || 0.004));
  g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(o.bus || sfxBus);
  src.start(t, Math.random()*0.5); src.stop(t + o.dur + 0.05);
}
function later(ms, fn){ setTimeout(fn, ms); }

// ---------- sound effects ----------
var sfx = {
  shoot: function(){
    noise({dur:0.05, vol:0.18, type:'highpass', freq:3000});
    tone({freq:700, slide:2400, dur:0.07, vol:0.16});
    tone({freq:180, slide:60, dur:0.09, vol:0.22, type:'triangle'});
  },
  click: function(){
    tone({freq:1400, dur:0.03, vol:0.12});
    tone({freq:300, slide:120, dur:0.05, vol:0.12, type:'triangle'});
  },
  pop: function(){
    noise({dur:0.12, vol:0.28});
    tone({freq:320, slide:120, dur:0.08, vol:0.2});
  },
  // pitchfork: aim whine, lock tick, throw whoosh, stick thud
  aim:   function(){ tone({freq:1800, slide:2600, dur:0.4, vol:0.05, type:'sine', attack:0.15}); },
  lock:  function(){ tone({freq:2200, dur:0.04, vol:0.14}); tone({freq:1100, dur:0.06, vol:0.1, type:'triangle'}); },
  throwFork: function(){ noise({dur:0.22, vol:0.2, type:'highpass', freq:900, slide:4000}); },
  stick: function(){ noise({dur:0.07, vol:0.14, freq:500}); tone({freq:140, slide:50, dur:0.09, vol:0.14, type:'sine'}); },
  graze: function(){ tone({freq:2400, slide:3400, dur:0.05, vol:0.11, type:'sine'}); },
  lost:  function(){ tone({freq:640, slide:180, dur:0.28, vol:0.16}); },
  clank: function(){
    noise({dur:0.08, vol:0.25, type:'bandpass', freq:3000});
    tone({freq:1800, slide:900, dur:0.1, vol:0.18});
  },
  hurt: function(){
    tone({freq:200, slide:50, dur:0.35, vol:0.5, type:'sawtooth'});
    noise({dur:0.3, vol:0.4});
  },
  grab: function(){ noise({dur:0.6, vol:0.22, freq:600, slide:120, attack:0.2}); tone({freq:70, slide:38, dur:0.7, vol:0.3, type:'sine', attack:0.15}); },
  volley: function(){ explosion(210, 1.3); noise({dur:0.5, vol:0.5, type:'highpass', freq:800, slide:5000}); },
  // fire: ignite crackle, eruption, breath warning growl, breath roar, ember hiss, bloom
  ignite: function(x){ whoosh(x); },
  crackle: function(x){ crackle(x); },
  erupt:  function(x){ explosion(x, 0.8); },
  impact: function(x, wall){ forkImpact(x, wall); },
  laughter: function(){ return laughter(); },
  breathWarn: function(){ tone({freq:48, slide:110, dur:1.0, vol:0.35, type:'sawtooth', filter:300, attack:0.3}); },
  breath: function(){ noise({dur:0.9, vol:0.45, freq:2200, slide:300, attack:0.03}); },
  jet: function(){ noise({dur:0.85, vol:0.36, type:'bandpass', freq:1400, q:0.8, slide:500, attack:0.02}); tone({freq:160, slide:70, dur:0.5, vol:0.2, type:'sawtooth', filter:400}); },
  emberLand: function(){ noise({dur:0.15, vol:0.08, type:'highpass', freq:5000}); },
  bloom: function(x){ explosion(x, 1); },
  eyeOpen: function(){
    tone({freq:300, slide:1400, dur:0.18, vol:0.2});
    noise({dur:0.12, vol:0.1, type:'highpass', freq:4000});
  },
  watch: function(){ tone({freq:55, dur:1.2, vol:0.18, type:'sine', attack:0.4}); noise({dur:1.1, vol:0.04, type:'bandpass', freq:2600, q:6, attack:0.3}); },
  eye: function(){
    tone({freq:1200, slide:300, dur:0.12, vol:0.4});
    noise({dur:0.1, vol:0.3});
  },
  roar: function(){
    tone({freq:120, slide:45, dur:0.7, vol:0.5, type:'sawtooth'});
    tone({freq:180, slide:60, dur:0.5, vol:0.3, type:'sawtooth'});
    noise({dur:0.6, vol:0.45, freq:900, slide:200});
  },
  laugh: function(){
    [230, 205, 180, 160, 145].forEach(function(f, i){
      later(i*150, function(){
        tone({freq:f, slide:f*0.8, dur:0.12, vol:0.3, type:'sawtooth', filter:1200});
      });
    });
  },
  kill: function(){
    tone({freq:110, slide:40, dur:1.2, vol:0.5, type:'sawtooth'});
    noise({dur:1.1, vol:0.5});
  },
  thunder: function(){ noise({dur:1.4, vol:0.5, freq:500, slide:60}); },
  boss: function(){
    tone({freq:70, slide:45, dur:1.4, vol:0.55, type:'sawtooth'});
    noise({dur:1.4, vol:0.5, freq:500, slide:60});
  },
  pause: function(){ tone({freq:440, dur:0.08, vol:0.15}); },
  win: function(){
    [523,659,784,1046].forEach(function(f,i){ later(i*150, function(){ tone({freq:f, dur:0.28, vol:0.35}); }); });
  },
  over: function(){
    [392,330,262,175].forEach(function(f,i){ later(i*200, function(){ tone({freq:f, dur:0.4, vol:0.35, type:'sawtooth'}); }); });
  }
};

// ---------- music ----------
// Patterns are 16 steps per bar, 4 steps per heartbeat. Tokens: note names
// (D2, Eb2 ...), '.' rest, and for drums 'x' (hit) / 'o' (soft hit).
// There is no kick: the heartbeat is the kick.
var NOTE = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
function midi(n){ return 440 * Math.pow(2, (n - 69) / 12); }
function parse(bars){
  return bars.join(' ').split(/\s+/).filter(Boolean).map(function(tok){
    if (tok === '.') return 0;
    if (tok === 'x') return 1;
    if (tok === 'o') return 0.55;
    var m = /^([A-G][b#]?)(\d)$/.exec(tok);
    if (!m) throw new Error('bad note token: ' + tok);
    return 12 * (parseInt(m[2], 10) + 1) + NOTE[m[1]];
  });
}

var TRACKS = {
  // Survive phase: sparse D Phrygian. Quiet and patient at a resting pulse,
  // driving once the heart races.
  survive: {
    bars: 4, bed: true, breath: true,
    bass: parse([
      'D2 . . . D2 . . . D2 . . . F2 . Eb2 .',
      'D2 . . . D2 . . . D2 . . . Bb2 . A2 .',
      'F2 . . . F2 . . . F2 . . . G2 . F2 .',
      'A2 . . . Bb2 . . . G2 . F2 . Eb2 . D2 .'
    ]),
    lead: parse([
      'D4 . . . . . . . A4 . . . . . . .',
      'D4 . . . . . . . Eb5 . . . D5 . . .',
      'F4 . . . . . . . C5 . . . . . . .',
      'Eb4 . . . . . . . D5 . . . A4 . . .'
    ]),
    snare: parse([
      '. . . . . . . . x . . . . . . .',
      '. . . . . . . . x . . . . . . .',
      '. . . . . . . . x . . . . . . .',
      '. . . . . . . . x . . . . . x .'
    ]),
    hat: parse([
      '. . o . . . o . . . o . . . o .',
      '. . o . . . o . . . o . . . o .',
      '. . o . . . o . . . o . . . o .',
      '. . o . . . o . . . o . . . o .'
    ])
  },
  // Devil fight: tritones, a sawtooth drone and the rumble underneath.
  devil: {
    bars: 4, bed: true, breath: true, drone: 38, leadType: 'sawtooth', leadDur: 3.2,
    bass: parse([
      'D2 D2 . D2 D2 D2 . Ab2 D2 D2 . D2 Ab2 . A2 .',
      'D2 D2 . D2 D2 D2 . Ab2 F2 F2 . F2 Eb2 . D2 .',
      'D2 D2 . D2 D2 D2 . Ab2 D2 D2 . D2 Ab2 . A2 .',
      'Bb2 Bb2 . Bb2 A2 A2 . A2 Ab2 Ab2 . Ab2 G2 . F2 .'
    ]),
    lead: parse([
      'D5 . . . Eb5 . . . D5 . . . Ab4 . . .',
      'A4 . . . Ab4 . F4 . Eb4 . . . D4 . . .',
      'D5 . . . Eb5 . . . F5 . . . Ab4 . A4 .',
      'Bb4 . . . A4 . . . Ab4 . . . G4 . F4 .'
    ]),
    snare: parse([
      '. . . . x . . . . . . . x . . .',
      '. . . . x . . . . . . . x . . .',
      '. . . . x . . . . . . . x . . .',
      '. . . . x . . . . . . . x . x x'
    ]),
    hat: parse([
      'x . o . x . o . x . o . x . o .',
      'x . o . x . o . x . o . x . o .',
      'x . o . x . o . x . o . x . o .',
      'x . o . x . o . x . o . x o x o'
    ])
  },
  // Title: drone and sparse bells.
  title: {
    bars: 4, drone: 38,
    bell: parse([
      'D5 . . . . . . . . . . . . . . .',
      '. . . . . . . . Ab4 . . . . . . .',
      'F4 . . . . . . . . . . . . . . .',
      '. . . . . . . . Eb4 . . . D4 . . .'
    ])
  },
  // Game over: a slow dirge.
  dirge: {
    bars: 2, drone: 26, bassDur: 7,
    bass: parse([
      'D2 . . . . . . . Ab2 . . . . . . .',
      'F2 . . . . . . . Eb2 . . . . . . .'
    ]),
    bell: parse([
      'D5 . . . . . . . . . . . Ab4 . . .',
      '. . . . F4 . . . . . . . Eb4 . . .'
    ])
  },
  // Victory: bright loop in D.
  win: {
    bars: 2, leadDur: 1.8,
    bass: parse([
      'D2 . . . D2 . . . G2 . . . A2 . . .',
      'D2 . . . D2 . . . Bb2 . . . A2 . . .'
    ]),
    lead: parse([
      'D5 . F#5 . A5 . D6 . B4 . D5 . G5 . A5 .',
      'D5 . F#5 . A5 . D6 . Bb4 . D5 . F5 . A5 .'
    ]),
    hat: parse([
      'o . x . o . x . o . x . o . x .',
      'o . x . o . x . o . x . o . x .'
    ])
  }
};
// sanity: every pattern must span bars*16 steps
Object.keys(TRACKS).forEach(function(k){
  var tr = TRACKS[k], len = tr.bars * 16;
  ['bass','lead','bell','snare','hat'].forEach(function(p){
    if (tr[p] && tr[p].length !== len) throw new Error('track ' + k + '.' + p + ' has ' + tr[p].length + ' steps, expected ' + len);
  });
});

// ----- instruments -----
function bass(t, n, dur){
  tone({freq:midi(n),    t:t, dur:dur, vol:0.34, type:'square',   filter:700, bus:musicBus});
  tone({freq:midi(n-12), t:t, dur:dur, vol:0.22, type:'triangle', bus:musicBus});
}
function lead(t, n, dur, type){
  tone({freq:midi(n), t:t, dur:dur, vol:0.10, type:type||'square', detune:-6, filter:2600, bus:musicBus});
  tone({freq:midi(n), t:t, dur:dur, vol:0.10, type:type||'square', detune: 6, filter:2600, bus:musicBus});
}
function bell(t, n){
  tone({freq:midi(n),   t:t, dur:1.6, vol:0.16, type:'sine', attack:0.01, bus:musicBus});
  tone({freq:midi(n)*3, t:t, dur:0.7, vol:0.04, type:'sine', attack:0.01, bus:musicBus});
}
function snare(t, v){
  noise({t:t, dur:0.14, vol:0.28*v, type:'bandpass', freq:1900, bus:musicBus});
  tone({freq:210, slide:110, t:t, dur:0.09, vol:0.22*v, type:'triangle', bus:musicBus});
}
function hat(t, v){ noise({t:t, dur:0.035, vol:0.12*v, type:'highpass', freq:7000, bus:musicBus}); }
// the heartbeat itself: lub, then a softer dub
function thump(t, v){
  tone({freq:64, slide:36, t:t, dur:0.24, vol:0.75*v, type:'sine', bus:heartBus});
  noise({t:t, dur:0.05, vol:0.06*v, freq:300, bus:heartBus});
}

// ----- sustained layers (drone, rumble bed, breathing, whispers) -----
var layers = [], whisperGain = null;
function layer(nodes, g){ layers.push({ nodes: nodes, g: g }); }
function startDrone(n){
  var a = actx, now = a.currentTime;
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.13, now + 1.5);
  var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220; f.Q.value = 3;
  var lfo = a.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.13;
  var lg = a.createGain(); lg.gain.value = 140; lfo.connect(lg); lg.connect(f.frequency);
  var o1 = a.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = midi(n);
  var o2 = a.createOscillator(); o2.type = 'sawtooth'; o2.frequency.value = midi(n); o2.detune.value = 7;
  var o3 = a.createOscillator(); o3.type = 'square';   o3.frequency.value = midi(n-12);
  o1.connect(f); o2.connect(f); o3.connect(f); f.connect(g); g.connect(musicBus);
  o1.start(); o2.start(); o3.start(); lfo.start();
  layer([o1,o2,o3,lfo], g);
}
function startBed(){
  var a = actx, now = a.currentTime;
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.09, now + 2);
  var f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 160;
  var src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  src.connect(f); f.connect(g); g.connect(musicBus); src.start();
  layer([src], g);
}
// something large breathing in the dark, ~0.3 Hz
function startBreath(){
  var a = actx, now = a.currentTime;
  var g = a.createGain();
  g.gain.setValueAtTime(0.0001, now);
  g.gain.linearRampToValueAtTime(0.05, now + 3);
  var lfo = a.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.3;
  var lg = a.createGain(); lg.gain.value = 0.045; lfo.connect(lg); lg.connect(g.gain);
  var f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 380; f.Q.value = 1.2;
  var src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  src.connect(f); f.connect(g); g.connect(musicBus); src.start(); lfo.start();
  layer([src, lfo], g);
  // whispers: filtered noise the game fades in late in the survive phase
  var w = a.createGain(); w.gain.value = 0.0001;
  var wf = a.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 2400; wf.Q.value = 10;
  var wl = a.createOscillator(); wl.type = 'sine'; wl.frequency.value = 0.7;
  var wlg = a.createGain(); wlg.gain.value = 700; wl.connect(wlg); wlg.connect(wf.frequency);
  var ws = a.createBufferSource(); ws.buffer = noiseBuf; ws.loop = true;
  ws.connect(wf); wf.connect(w); w.connect(musicBus); ws.start(); wl.start();
  layer([ws, wl], w);
  whisperGain = w;
}
function stopLayers(fade){
  whisperGain = null;
  if (!layers.length) return;
  var a = actx, now = a.currentTime, old = layers; layers = [];
  fade = fade == null ? 0.8 : fade;
  old.forEach(function(L){
    L.g.gain.cancelScheduledValues(now);
    L.g.gain.setValueAtTime(L.g.gain.value, now);
    L.g.gain.linearRampToValueAtTime(0.0001, now + fade);
  });
  later(fade * 1000 + 100, function(){ old.forEach(function(L){ L.nodes.forEach(function(n){ try { n.stop(); } catch(e){} }); }); });
}

// ---------- impacts, explosions, fire voices, his laugh ----------
// pan by arena x (0..420)
function panner(x){
  if (!actx.createStereoPanner) return null;
  var pn = actx.createStereoPanner();
  pn.pan.value = Math.max(-1, Math.min(1, (x / 420) * 2 - 1)) * 0.7;
  return pn;
}
// a pitchfork striking stone: a low sine pitched down fast, a filtered
// clatter. ±15 % pitch and level per hit, panned by x, tighter for walls.
// Never more than three at once.
var thudsLive = 0;
function forkImpact(x, wall){
  if (!running() || thudsLive >= 3) return;
  thudsLive++; later(260, function(){ thudsLive--; });
  var v = 0.85 + Math.random() * 0.3, pv = 0.85 + Math.random() * 0.3;
  var pn = panner(x), bus = sfxBus;
  if (pn){ pn.connect(sfxBus); bus = pn; }
  var f0 = (wall ? 92 : 70) * pv, dur = wall ? 0.14 : 0.22;
  tone({freq: f0, slide: f0 * 0.42, dur: dur, vol: 0.55 * v, type: 'sine', bus: bus});
  noise({dur: wall ? 0.05 : 0.08, vol: 0.28 * v, type: 'bandpass', freq: (wall ? 3200 : 2400) * pv, q: 1.4, bus: bus});
  noise({dur: 0.03, vol: 0.18 * v, type: 'highpass', freq: 5000, bus: bus});
}
// an explosion with weight: sub drop, a mid body through a lowpass that opens
// then closes, a bright crack on the front. Ducks the music underneath.
function explosion(x, size){
  if (!running()) return;
  size = size == null ? 1 : size;
  var a = actx, t = a.currentTime, pn = panner(x == null ? 210 : x), bus = sfxBus;
  if (pn){ pn.connect(sfxBus); bus = pn; }
  tone({freq: 50, slide: 25, dur: 0.4 * size, vol: 0.9 * size, type: 'sine', bus: bus});
  // the body: noise through a lowpass that opens over 60 ms and closes over 400
  var src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  var f = a.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 0.9;
  f.frequency.setValueAtTime(220, t); f.frequency.linearRampToValueAtTime(2600, t + 0.06); f.frequency.exponentialRampToValueAtTime(180, t + 0.5 * size);
  var g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.7 * size, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55 * size);
  src.connect(f); f.connect(g); g.connect(bus); src.start(t, Math.random() * 0.5); src.stop(t + 0.6 * size);
  noise({dur: 0.03, vol: 0.5, type: 'highpass', freq: 3500, bus: bus});
  duckMusic(0.3, 0.05, 0.35);
}
function duckMusic(to, hold, release){
  var t = actx.currentTime;
  musicBus.gain.cancelScheduledValues(t);
  musicBus.gain.setTargetAtTime(MUSIC_GAIN * to, t, 0.01);
  musicBus.gain.setTargetAtTime(MUSIC_GAIN, t + hold, release);
}
// ----- fire voices: each active flame breathes through its own bandpass -----
var fireBus = null, fireVoices = {}, FIRE_MAX = 4;
function fireBusGet(){
  if (!fireBus){ fireBus = actx.createGain(); fireBus.gain.value = 0.7; fireBus.connect(master); }
  return fireBus;
}
function makeFireVoice(x){
  var a = actx, t = a.currentTime;
  var src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  var f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random() * 300; f.Q.value = 0.9;
  var lfo = a.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.25 + Math.random() * 0.4;
  var lg = a.createGain(); lg.gain.value = 260; lfo.connect(lg); lg.connect(f.frequency);
  var g = a.createGain(); g.gain.value = 0.0001;
  var glfo = a.createOscillator(); glfo.type = 'sine'; glfo.frequency.value = 0.4 + Math.random() * 0.5;
  var glg = a.createGain(); glg.gain.value = 0.35; glfo.connect(glg);   // breathes: applied to a second gain stage
  var breathe = a.createGain(); breathe.gain.value = 1; glg.connect(breathe.gain);
  var pn = panner(x);
  src.connect(f); f.connect(g); g.connect(breathe);
  if (pn){ breathe.connect(pn); pn.connect(fireBusGet()); } else breathe.connect(fireBusGet());
  src.start(t, Math.random() * 0.5); lfo.start(); glfo.start();
  return { src: src, f: f, g: g, pn: pn, nodes: [src, lfo, glfo], level: 0 };
}
function killFireVoice(v){
  var a = actx, t = a.currentTime;
  v.g.gain.cancelScheduledValues(t); v.g.gain.setTargetAtTime(0.0001, t, 0.25);
  later(900, function(){ v.nodes.forEach(function(n){ try { n.stop(); } catch(e){} }); });
}
// entries: [{id, x, h (0..1 of full height), dist (px from the heart)}]
function fireUpdate(entries){
  if (!running()) return;
  var a = actx, t = a.currentTime, want = {};
  // the bandpass keeps only a sliver of the noise, so the level sits well above unity
  entries.forEach(function(e){ e.level = e.h * (1 - Math.min(1, e.dist / 520)) * 1.4; });
  entries.sort(function(u, v){ return v.level - u.level; }).slice(0, FIRE_MAX).forEach(function(e){ want[e.id] = e; });
  Object.keys(fireVoices).forEach(function(id){ if (!want[id]){ killFireVoice(fireVoices[id]); delete fireVoices[id]; } });
  Object.keys(want).forEach(function(id){
    var e = want[id], v = fireVoices[id];
    if (!v){ v = fireVoices[id] = makeFireVoice(e.x); }
    v.g.gain.setTargetAtTime(Math.max(0.0001, e.level), t, 0.12);
    if (v.pn) v.pn.pan.setTargetAtTime(Math.max(-1, Math.min(1, (e.x / 420) * 2 - 1)) * 0.7, t, 0.2);
  });
}
// a rising whoosh at ignition, and sparse pops as a fire dies
function whoosh(x){
  if (!running()) return;
  var a = actx, t = a.currentTime, pn = panner(x), bus = sfxBus;
  if (pn){ pn.connect(sfxBus); bus = pn; }
  var src = a.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
  var f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(260, t); f.frequency.exponentialRampToValueAtTime(3200, t + 0.35);
  var g = a.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.32, t + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
  src.connect(f); f.connect(g); g.connect(bus); src.start(t, Math.random() * 0.5); src.stop(t + 0.55);
}
function crackle(x){
  if (!running()) return;
  var pn = panner(x), bus = sfxBus;
  if (pn){ pn.connect(sfxBus); bus = pn; }
  for (var i=0;i<7;i++){
    var dt = Math.random() * 0.7;
    noise({t: actx.currentTime + dt, dur: 0.012 + Math.random() * 0.02, vol: 0.12 + Math.random() * 0.14, type: 'highpass', freq: 2500 + Math.random() * 3000, bus: bus});
  }
}
// ----- his laugh: a low voice in bursts, a fifth below it detuned, a long tail -----
var reverb = null;
function reverbGet(){
  if (reverb) return reverb;
  var a = actx, len = Math.floor(a.sampleRate * 2.6), buf = a.createBuffer(2, len, a.sampleRate);
  for (var c=0;c<2;c++){ var d = buf.getChannelData(c); for (var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.6) * (i < 400 ? i/400 : 1); }
  var cv = a.createConvolver(); cv.buffer = buf;
  var wet = a.createGain(); wet.gain.value = 0.55; cv.connect(wet); wet.connect(master);
  reverb = { input: cv };
  return reverb;
}
// returns the laugh's length in seconds
function laughter(){
  if (!running()) return 2.4;
  var a = actx, t0 = a.currentTime + 0.02;
  var out = a.createGain(); out.gain.value = 1; out.connect(master); out.connect(reverbGet().input);
  var bursts = [[0.0, 0.2, 108], [0.3, 0.22, 104], [0.64, 0.26, 98], [1.04, 0.3, 90], [1.52, 0.4, 82]];
  [1, 2/3].forEach(function(ratio, vi){
    var o = a.createOscillator(); o.type = 'sawtooth';
    var o2 = a.createOscillator(); o2.type = 'square';
    var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520; lp.Q.value = 1.2;
    var fm = a.createBiquadFilter(); fm.type = 'bandpass'; fm.frequency.value = 640; fm.Q.value = 2.2;   // a rough "ah"
    var g = a.createGain(); g.gain.setValueAtTime(0.0001, t0);
    o.connect(lp); o2.connect(lp); lp.connect(fm); fm.connect(g); g.connect(out);
    bursts.forEach(function(b){
      var bt = t0 + b[0], bd = b[1], f = b[2] * ratio;
      o.frequency.setValueAtTime(f * 1.06, bt); o.frequency.exponentialRampToValueAtTime(f * 0.94, bt + bd);
      o2.frequency.setValueAtTime(f * 1.06 * (vi ? 1.004 : 1), bt); o2.frequency.exponentialRampToValueAtTime(f * 0.94 * (vi ? 1.004 : 1), bt + bd);
      g.gain.setValueAtTime(0.0001, bt); g.gain.linearRampToValueAtTime(vi ? 0.4 : 0.6, bt + 0.04);
      g.gain.setValueAtTime(vi ? 0.4 : 0.6, bt + bd * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, bt + bd);
    });
    o.start(t0); o2.start(t0); o.stop(t0 + 2.3); o2.stop(t0 + 2.3);
  });
  // duck everything else while it plays
  [sfxBus, musicBus, heartBus].forEach(function(b, i){
    var base = i === 0 ? 1 : (i === 1 ? MUSIC_GAIN : HEART_GAIN);
    b.gain.cancelScheduledValues(t0); b.gain.setTargetAtTime(base * (i === 2 ? 0.5 : 0.22), t0, 0.05);
    b.gain.setTargetAtTime(base, t0 + 2.0, 0.4);
  });
  if (fireBus){ fireBus.gain.setTargetAtTime(0.15, t0, 0.05); fireBus.gain.setTargetAtTime(0.7, t0 + 2.0, 0.4); }
  return 2.3;
}
// bus meters for the mix check: peak of each bus over the last buffer
var meters = null;
function meter(){
  if (!running()) return null;
  if (!meters){
    meters = {};
    [['master', master], ['music', musicBus], ['sfx', sfxBus], ['heart', heartBus], ['fire', fireBusGet()]].forEach(function(p){
      var an = actx.createAnalyser(); an.fftSize = 2048; p[1].connect(an); meters[p[0]] = an;
    });
  }
  var out = {}, buf = new Float32Array(2048);
  Object.keys(meters).forEach(function(k){ meters[k].getFloatTimeDomainData(buf); var pk = 0, rms = 0; for (var i=0;i<buf.length;i++){ var v = Math.abs(buf[i]); if (v > pk) pk = v; rms += buf[i]*buf[i]; } out[k] = { peak: +pk.toFixed(3), rms: +Math.sqrt(rms / buf.length).toFixed(3) }; });
  return out;
}

// ----- sequencer (heartbeat-driven) -----
var seq = { name:null, track:null, step:0 };
var music = {};
function scheduleStep(tr, step, t, spb){
  var n;
  if (tr.bass  && (n = tr.bass[step]))  bass(t, n, spb * (tr.bassDur || 1.6));
  if (tr.lead  && (n = tr.lead[step]))  lead(t, n, spb * (tr.leadDur || 1.6), tr.leadType);
  if (tr.bell  && (n = tr.bell[step]))  bell(t, n);
  if (tr.snare && (n = tr.snare[step])) snare(t, n);
  if (tr.hat   && (n = tr.hat[step]))   hat(t, n);
}
music.play = function(name, force){
  var a = ctx(); if (!a) return;
  if (seq.name === name && !force) return;
  music.stop();
  var tr = TRACKS[name]; if (!tr) return;
  seq.name = name; seq.track = tr; seq.step = 0;
  if (tr.drone) startDrone(tr.drone);
  if (tr.bed) startBed();
  if (tr.breath) startBreath();
};
music.stop = function(fade){
  seq.name = null; seq.track = null;
  stopLayers(fade);
};
music.current = function(){ return seq.name; };
// One heartbeat. period: seconds until the next beat; dub: seconds until the
// second, softer thump; strength: 0..1.6 (a hit sends an oversized beat).
// The track advances four sixteenths from this beat.
music.beat = function(period, dub, strength, silent){
  if (!running()) return;
  var t0 = actx.currentTime + 0.03;
  if (!silent){
    thump(t0, 0.35 + 0.65 * Math.min(1, strength));
    thump(t0 + dub, 0.22 + 0.4 * Math.min(1, strength));
    // the fire ducks under every beat so the heart is never drowned
    if (fireBus){ fireBus.gain.setTargetAtTime(0.28, t0, 0.008); fireBus.gain.setTargetAtTime(0.7, t0 + 0.14, 0.09); }
  }
  var tr = seq.track; if (!tr) return;
  var spb = period / 4, len = tr.bars * 16;
  for (var k=0;k<4;k++){
    scheduleStep(tr, seq.step, t0 + k*spb, spb);
    seq.step = (seq.step + 1) % len;
  }
};
// whispers: 0..1
music.whisper = function(k){
  if (!whisperGain || !running()) return;
  whisperGain.gain.setTargetAtTime(Math.max(0.0001, k * 0.06), actx.currentTime, 0.4);
};
var pausedName = null;
music.pause  = function(){ pausedName = seq.name; music.stop(0.2); };
music.resume = function(){ if (pausedName) music.play(pausedName, true); pausedName = null; };

window.BTD_AUDIO = {
  sfx: sfx,
  music: music,
  unlock: ctx,
  fire: { update: fireUpdate },
  meter: meter,
  setMuted: function(m){ muted = !!m; if (master) master.gain.value = muted ? 0 : MASTER_GAIN; },
  // the beat heard from inside a closed fist
  muffle: function(on){
    if (!heartFilter || !running()) return;
    heartFilter.frequency.setTargetAtTime(on ? 220 : 20000, actx.currentTime, 0.15);
    heartBus.gain.setTargetAtTime(HEART_GAIN * (on ? 0.8 : 1), actx.currentTime, 0.15);
  },
  isMuted: function(){ return muted; }
};

})();
</script>
<script>
// game.js — Beat the Devil.
// A white heart, five bolts, and the Devil. Two of the bolts are for his eyes;
// nothing but the title card will remind you. The heartbeat is the game's
// clock: the floor, the embers, his aura and the music all pulse off it.
(function(){
"use strict";

var AUDIO = window.BTD_AUDIO, sfx = AUDIO.sfx, music = AUDIO.music;

// ---------- setup ----------
var LW = 420, LH = 640;
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');
var stage = document.getElementById('stage');
var wrap = document.getElementById('wrap');
var monitor = document.getElementById('monitor');
var scale = 1;
// bezel extents in logical px at --s = 1 (must match style.css #monitor padding)
var BEZEL_X = 26 * 2, BEZEL_Y = 24 + 44;

var isTouch = (window.matchMedia && window.matchMedia('(pointer:coarse)').matches) ||
              ('ontouchstart' in window);

// on a small screen the bezel goes and the glass takes the whole screen
var bare = false, CTL = null;
function resize(){
  bare = Math.min(window.innerWidth, window.innerHeight) < 600;
  document.body.classList.toggle('bare', bare);
  var pad = bare ? 0 : 12, bx = bare ? 0 : BEZEL_X, by = bare ? 0 : BEZEL_Y;
  var aw = wrap.clientWidth - pad, ah = wrap.clientHeight - pad;
  scale = Math.min(aw / (LW + bx), ah / (LH + by));

// A tiling value-noise field, and a small palette-mapped fire texture rendered

  var p = G.player, best = 1e9, d;

    if (f.state === 'fly' || f.state === 'stuck') d = Math.hypot(p.x - f.x, p.y - f.y);
    else d = Math.hypot(p.x - f.tx, p.y - f.ty) + 60;   // being aimed at counts, less
    if (d < best) best = d;
  });
  G.flames.forEach(function(fl){
    if (fl.type === 'walker'){
      d = Math.abs(p.x - fl.x); if (p.y < LH - fl.h) d = Math.hypot(d, (LH - fl.h) - p.y);
    } else if (fl.type === 'ember'){
      if (fl.state === 'fly') d = Math.hypot(p.x - fl.x, p.y - fl.y) + 30;
      else d = fl.t > fl.fuse * 0.5 ? Math.hypot(p.x - fl.tx, p.y - fl.ty) : 1e9;
    } else if (fl.type === 'breath'){
      d = (p.x < LW/2 ? -1 : 1) === fl.side ? 40 : 1e9;
    } else if (fl.type === 'jet'){
      var jl = jetLen(fl);
      if (jl > 0){ var jd = jetDir(fl); d = distToSeg(p.x, p.y, fl.ox, fl.oy, fl.ox + jd.x * jl, fl.oy + jd.y * jl) - 20; }
      else d = Math.hypot(p.x - fl.tx, p.y - fl.ty) + 60;
    }
    if (d < best) best = d;
  });
  if (G.devil) G.devil.eyes.forEach(function(e){
    if (e.charge > 0 || e.beam > 0){ d = Math.abs(p.x - e.lockX) + 20; if (d < best) best = d; }
  });

}
function updateHeart(dt){
  var h = G.heart, target;
  if (h.override >= 0) target = h.override;
  else if (G.mode === 'play' || G.mode === 'ending'){
    var danger = 1 - clamp((nearestHazard() - 30) / 220, 0, 1);
    if (G.phase === 'survive') danger = Math.max(danger, G.prog * 0.55);
    else danger = Math.max(danger, 0.45);
    if (G.lives === 1) danger = Math.max(danger, 0.55);
    h.danger = danger;
    target = 68 + 82 * danger;
    if (G.penalty && G.penalty.kind === 'burn') target += 55;            // panicked
    if (G.penalty && G.penalty.kind === 'fork') target *= 0.72;          // labored
    if (G.ending && G.ending.kind === 'dead') target = 0;
  } else if (G.mode === 'over') target = 46;
  else if (G.mode === 'won') target = 84;
  else target = 68;

  if (target <= 0){ h.pulse = decay(h.pulse, 3, dt); h.scale = 1; return; }  // the heart is still
  h.bpm += (target - h.bpm) * Math.min(1, dt * 1.2);
  h.period = 60 / h.bpm;
  if (h.arr > 0) h.arr -= dt;
  h.settleT += dt; h.settleAmp = decay(h.settleAmp, 2.2, dt); h.flutter = decay(h.flutter, 2, dt);
  if (h.stop > 0){ h.stop -= dt; h.pulse = decay(h.pulse, 6, dt); h.scale = 1; return; }   // stopped dead
  if (G.hold > 0){ h.pulse = decay(h.pulse, 3, dt); h.scale = 1; return; }   // it skips a beat

  h.since += dt;
  if (!h.dubDone && h.since >= h.dubAt){ h.dubDone = true; h.pulse = Math.max(h.pulse, 0.55); }
  if (h.since >= h.next){
    h.since = 0; h.dubDone = false;
    var big = h.big; h.big = false;
    var dmg = (G.mode === 'play' || G.mode === 'ending') ? 3 - G.lives : 0;
    var pen = G.penalty ? G.penalty.kind : '';
    h.lubScale = big ? 1.32 : (pen === 'burn' ? 1.06 : (pen === 'fork' ? 1.24 : (dmg >= 2 ? 1.2 : 1.14)));
    h.pulse = pen === 'burn' ? 0.7 : 1;                                   // fast and shallow
    h.settleT = 0; h.settleAmp = big ? 1.6 : 1;
    h.next = h.arr > 0 ? h.period * rnd(0.5, 1.7) : h.period;
    if (dmg === 1 && Math.random() < 0.18) h.next *= rnd(0.75, 1.35);   // a stumble now and then
    if (dmg >= 2) h.next *= rnd(0.62, 1.55);                              // never regular again
    if (pen === 'fork' && Math.random() < 0.5) h.next *= 1.4;             // the hitch
    if (h.flutterDue){ h.flutterDue = false; h.next = 0.19; h.flutter = 1; }   // the involuntary double-beat
    h.dubAt = Math.min(pen === 'fork' ? 0.42 : (dmg >= 2 ? 0.34 : 0.28), h.next * 0.45);
    music.beat(h.next, h.dubAt, big ? 1.6 : 0.25 + 0.75 * h.danger, G.heartSilent || (G.mode === 'title' && !music.current()));
  }
  h.scale = 1 + env(h.since, 0.09, 0.18) * (h.lubScale - 1)
              + (h.dubDone ? env(h.since - h.dubAt, 0.07, 0.15) * 0.08 : 0);
  h.pulse = decay(h.pulse, 3.5, dt);
}

// ---------- spawning ----------
// Pitchforks are thrown, not dropped: aim (a thin line tracks you), lock
// (the line snaps solid, aimed where you will be), throw (a fixed vector).
// They stick in the floor and stay dangerous for a moment.
var forkGroup = 0;
function throwFork(kind, ox, oy){
  var p = G.player;
  if (ox == null){ ox = rnd(30, LW-30); oy = -14; }
  var group = ++forkGroup;
  function mk(tx, ty, track, spread, delay){
    G.forks.push({ group: group, ox: ox, oy: oy, x: ox, y: oy, tx: tx, ty: ty, track: track, spread: spread || 0,
                   state: 'aim', t: -(delay || 0), aimT: 0.45, lockT: 0.22,
                   vx: 0, vy: 0, rot: 0, r: 11, grazed: false, stuckT: 0 });
  }
  if (kind === 'fan'){
    mk(p.x, p.y, true, -0.26); mk(p.x, p.y, true, 0); mk(p.x, p.y, true, 0.26);
  } else if (kind === 'bracket'){
    // pins both sides of where you are now; commit before it locks
    mk(clamp(p.x - 64, 24, LW-24), p.y, false); mk(clamp(p.x + 64, 24, LW-24), p.y, false);
  } else {
    mk(p.x, p.y, true);
  }
  sfx.aim();
}
// the arrival volley: fast, unaimed, straight out of his mouth
function eruptForks(ox, oy, n){
  for (var i=0;i<n;i++){
    var ang = Math.PI * 0.22 + (i / (n-1)) * Math.PI * 0.56 + rnd(-0.06, 0.06);
    var sp = 700 + rnd(-70, 70);
    G.forks.push({ group: ++forkGroup, ox: ox, oy: oy, x: ox, y: oy, tx: 0, ty: 0, track: false, spread: 0,
                   state: 'fly', t: 0, aimT: 0, lockT: 0,
                   vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, rot: ang - Math.PI/2, r: 11, grazed: false, stuckT: 0 });
  }
}
// how many hazards are live: fork volleys count once, every flame counts
function hazardCount(){
  var groups = {}, n = 0;
  G.forks.forEach(function(f){ if (!groups[f.group]){ groups[f.group] = true; n++; } });
  G.flames.forEach(function(f){ if (!(f.type === 'walker' && f.state === 'die')) n++; });
  return n;
}
// survive phase: never more than two hazards of any kind at once. Skip, never queue.
function mayspawn(){ return G.phase !== 'survive' || hazardCount() < 2; }
// which halves currently have a jet aiming or firing from their wall
function jetHalves(){
  var h = {};
  G.flames.forEach(function(f){ if (f.type === 'jet') h[f.side] = true; });
  return h;
}
// which halves have a floor column still rising
function risingHalves(){
  var h = {};
  G.flames.forEach(function(f){ if (f.type === 'walker' && f.state !== 'die' && f.age < 0.8) h[f.x < LW/2 ? -1 : 1] = true; });
  return h;
}
// the x-interval a floor flame owns, including everywhere it may still walk
function walkerSpan(fl){
  var a = Math.min(fl.x, fl.targetX) - fl.w * 0.5 - 8, b = Math.max(fl.x, fl.targetX) + fl.w * 0.5 + 8;
  return [Math.max(0, a), Math.min(LW, b)];
}
// invariant: at least 40 % of the width stays flame-free. Returns true if a
// new flame spanning [a, b] would still leave that much.
function flameFreeOK(a, b){
  var spans = [[a, b]];
  G.flames.forEach(function(fl){ if (fl.type === 'walker' && fl.state !== 'die') spans.push(walkerSpan(fl)); });
  spans.sort(function(u, v){ return u[0] - v[0]; });
  var covered = 0, curA = spans[0][0], curB = spans[0][1];
  for (var i=1;i<spans.length;i++){
    if (spans[i][0] <= curB) curB = Math.max(curB, spans[i][1]);
    else { covered += curB - curA; curA = spans[i][0]; curB = spans[i][1]; }
  }
  covered += curB - curA;
  return covered <= LW * 0.6;
}
// A floor flame. Its target x is locked at ignition (the heart's x, at most
// `cap` px away); it walks there at 100 px/s and never moves again. Rises to
// full height over 0.8 s. Skipped if it would break the flame-free invariant.
function spawnWalker(x, cap){
  var p = G.player;
  if (x == null){
    x = rnd(30, LW-30);
    if (Math.abs(x - p.x) < 100) x = p.x + (p.x < LW/2 ? 1 : -1) * rnd(130, 190);
    // never rise on a half a jet is working; alternate with it
    var jh = jetHalves();
    if (jh[x < LW/2 ? -1 : 1] && !jh[x < LW/2 ? 1 : -1]) x = LW - x;
    x = clamp(x, 30, LW-30);
  }
  cap = cap == null ? 140 : cap;
  var w = G.inferno ? 72 : 60;
  var targetX = clamp(x + clamp(p.x - x, -cap, cap), 30, LW - 30);
  var a = Math.min(x, targetX) - w * 0.5 - 8, b = Math.max(x, targetX) + w * 0.5 + 8;
  if (!flameFreeOK(Math.max(0, a), Math.min(LW, b))) return false;
  G.lastWalkerHalf = x < LW/2 ? -1 : 1;
  var limit = flameLimit();
  var hmax = Math.min(limit, G.phase === 'survive' ? rnd(300, 420) : rnd(220, 300));
  G.flames.push({ type:'walker', x: x, targetX: targetX, h: 0, hmax: hmax, w: w,
                  t: 0, age: 0, flare: 0, state:'walk', seed: Math.random() });
  sfx.ignite(x);
  return true;
}
// An angled flame jet from a wall. Same contract as the forks: the vent glows
// and an aim line tracks the heart for 0.6 s, the line locks and flashes,
// then a lance fires along that fixed vector: 40 px wide, 450 px long,
// 0.3 s out, 0.5 s held, then it retracts. Always 15–35° above horizontal.
// Aimed at where the heart is at lock time, not led. Returns false when both
// halves have a column rising, so the caller can try again shortly.
function spawnJet(){
  var p = G.player, rising = risingHalves(), sides = [];
  if (G.flames.some(function(f){ return f.type === 'jet'; })) return false;   // one at a time
  if (!rising[-1]) sides.push(-1);
  if (!rising[1]) sides.push(1);
  if (!sides.length) return false;
  // prefer the half opposite the last column, then the wall further from the heart
  var side;
  if (sides.length === 2) side = G.lastWalkerHalf ? -G.lastWalkerHalf : (p.x < LW/2 ? 1 : -1);
  else side = sides[0];
  var ox = side < 0 ? 0 : LW;
  var dx = Math.max(60, Math.abs(p.x - ox));
  var oy = clamp(p.y + dx * Math.tan(25 * Math.PI/180), 200, FLOOR - 12);
  G.flames.push({ type:'jet', side: side, ox: ox, oy: oy, tx: p.x, ty: p.y, ang: 0,
                  state:'aim', t: 0, aimT: 0.9, lockT: 0.22, len: 0, seed: Math.random() });
  sfx.aim();
  return true;
}
function jetDir(j){ return { x: -j.side * Math.cos(j.ang), y: -Math.sin(j.ang) }; }   // into the arena, upward
function jetLen(j){
  if (j.state === 'fire') return 450 * smooth(j.t / 0.3);
  if (j.state === 'hold') return 450;
  if (j.state === 'retract') return 450 * (1 - smooth(j.t / 0.3));
  return 0;
}
function distToSeg(px, py, ax, ay, bx, by){
  var vx = bx - ax, vy = by - ay, L2 = vx*vx + vy*vy || 1;
  var k = clamp(((px - ax) * vx + (py - ay) * vy) / L2, 0, 1);
  return Math.hypot(px - (ax + vx*k), py - (ay + vy*k));
}
// A fireball: thrown from the dark above (or his mouth) at where the heart is
// now, not led. It tumbles in with a tail, lands, scorches a ring into the
// floor that brightens and contracts over the fuse, then detonates.
function spawnEmber(ox, oy){
  var p = G.player;
  var tx = p.x, ty = p.y;
  if (ox == null){ ox = clamp(tx + rnd(-140, 140), 20, LW - 20); oy = -24; }
  var dx = tx - ox, dy = ty - oy, dist = Math.hypot(dx, dy) || 1, sp = 430;
  G.flames.push({ type:'ember', state:'fly', x: ox, y: oy, tx: tx, ty: ty, vx: dx / dist * sp, vy: dy / dist * sp,
                  t: 0, fuse: 1.2, rot: rnd(0, 6.28), spin: rnd(5, 9) * (Math.random() < 0.5 ? -1 : 1), seed: Math.random() });
  sfx.throwFork();
}
function spawnBreath(side){
  G.flames.push({ type:'breath', side: side, t: 0, warn: 1.0, burn: 0.8 });
  sfx.breathWarn();
}
function burst(x, y, color, n, spd, grav){
  for (var i=0;i<(n||8);i++){
    var a = rnd(0, Math.PI*2), s = rnd(40, spd||210);
    addPart({ x:x, y:y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rnd(0.3,0.75), t:0, c: color, r: rnd(1.3,3.2), g: grav == null ? 260 : grav });
  }
}
function addText(x, y, text, color, life, size){
  G.texts.push({ x: clamp(x, 40, LW-40), y: y, text: text, c: color || COLORS.bone, t: 0, life: life || 0.9, size: size || 8 });
}

// ---------- devil ----------
function makeDevil(){
  return {
    x: LW/2, y: -170, targetY: 138,
    w: 268, h: 176,
    sway: 0, swayAmp: 58,
    state: 'wait', st: 0,      // wait | enter | arrive | open | attack | taken
    cycle: 0, attack: '', rage: 0, kick: 0,
    mouth: 0, mouthGlow: 0, turn: 0,
    dying: false, dieT: 0, dead: false,
    eyes: [
      { dx: -56, open: false, flash: 0, dead: false, charge: 0, beam: 0, lockX: LW/2, wide: 0, ember: 0.15 },
      { dx:  56, open: false, flash: 0, dead: false, charge: 0, beam: 0, lockX: LW/2, wide: 0, ember: 0.15 }
    ]

}
function livingEyes(d){ return d.eyes.filter(function(e){ return !e.dead; }); }
function anyEyeOpen(d){ return d.eyes.some(function(e){ return e.open && !e.dead; }); }
function devilSpeed(d){ return Math.pow(1.2, d.rage); }

// ---------- firing ----------
function fire(){
  var p = G.player;
  if (G.fireCd > 0 || G.ammo <= 0) return;     // empty is just empty
  G.ammo--;
  G.bolts.push({ x: p.x, y: p.y - 14, vy: -BOLT_SPEED });
  G.fireCd = 0.28;
  G.recoil = 1;

}
function boltLost(b, why){
  addText(b.x, Math.max(30, b.y + 40), why || 'LOST', COLORS.ember, 0.9);
  sfx.lost();
  checkAmmo();
}
function boltWasted(b, why){
  burst(b.x, b.y, COLORS.ash, 5, 140);
  addText(b.x, b.y + 30, why, COLORS.sulfur, 1.0);

}
// Only at zero. One bolt and two eyes is already lost, and it plays on.
function checkAmmo(){
  if (G.phase !== 'devil' || !G.devil || G.devil.dying || G.mode !== 'play') return;
  if (G.devil.state === 'wait' || G.devil.state === 'enter' || G.devil.state === 'arrive') return;
  if (G.ammo + G.bolts.length === 0 && livingEyes(G.devil).length > 0 && G.devil.takeIn == null) G.devil.takeIn = 1.0;
}

// ---------- endings ----------
function beginEnding(kind, dur){
  G.mode = 'ending';
  G.ending = { kind: kind, t: 0, dur: dur };
  keys = {}; fireQueued = false;
  if (G.devil) G.devil.eyes.forEach(function(e){ e.beam = 0; e.charge = 0; });
}
// He takes it. Input is cut; the heart keeps beating, slowing, and drifts —
// no longer yours. His hand closes around it; the beat goes on inside the
// fist. He turns and points at the player. The beat stops. Black.
function loseHeart(){
  var d = G.devil;
  beginEnding('taken', 9.8);
  d.state = 'taken';
  d.eyes.forEach(function(e){ e.open = false; e.wide = 0; });
  G.taken = { t: 0, bpm: G.heart.bpm, hand: { x: G.player.x, y: G.player.y, close: 0 }, point: 0, grabbed: false, stopped: false };
  if (G.arms){ G.arms.l.mode = 'reach'; G.arms.r.mode = 'reach'; G.arms.reach = 0; }
  // everything on screen burns out
  G.forks.forEach(function(f){ burst(f.x, f.y, '#ff6a1f', 3, 90); });
  G.forks.length = 0;
  G.flames.forEach(function(fl){
    if (fl.type === 'walker'){ fl.state = 'die'; fl.t = 0; }
    else if (fl.type === 'ember'){ fl.state = 'bloom'; fl.t = fl.fuse + 0.5; }
    else if (fl.type === 'jet'){ if (fl.len > 0){ fl.state = 'retract'; fl.t = 0; } else { fl.state = 'retract'; fl.t = 1; } }
    else fl.t = fl.warn + fl.burn;
  });
  music.stop(1.2);
  music.whisper(0);
}
function updateTaken(dt){
  var T = G.taken, d = G.devil, p = G.player, h = G.heart;
  T.t += dt;
  var t = T.t;
  // the heart slows all the way through, and stops
  T.bpm += (36 - T.bpm) * Math.min(1, dt * 0.5);
  h.override = t < 7.3 ? T.bpm : 0;
  if (t >= 7.3 && !T.stopped){ T.stopped = true; G.heartSilent = true; }
  if (!T.grabbed){
    // adrift
    p.x += Math.sin(t * 0.9) * 14 * dt;
    p.y -= 12 * dt;
  }
  // both clawed hands come in from the sides and close around the heart
  var hand = T.hand, A = G.arms;
  hand.x = p.x; hand.y = p.y;
  if (t > 1.0 && A){
    A.reach = smooth((t - 1.0) / 1.6);
    if (t > 1.05 && !T.rumbled){ T.rumbled = true; sfx.grab(); }
  }
  if (t > 2.6){
    hand.close = smooth((t - 2.6) / 0.5);
    if (!T.grabbed && hand.close >= 1){ T.grabbed = true; AUDIO.muffle(true); }
  }
  if (T.grabbed){
    // the hands lift it toward him, and he turns to the player
    var k2 = smooth((t - 4.2) / 1.2);
    // lifted to just below his mouth, glowing, beating slowly, dimming until it goes out
    p.x = lerp(p.x, d.x + (d.turn || 0) * 30, Math.min(1, dt * 2 * (t > 4.2 ? 1 : 0)));
    p.y = lerp(p.y, d.y + 128, Math.min(1, dt * 2 * (t > 4.2 ? 1 : 0)));
    T.glow = 1 - smooth((t - 3.0) / 4.3);
    hand.x = p.x; hand.y = p.y;
    d.turn = k2;
    T.point = smooth((t - 4.8) / 1.5);   // the right hand lets go and points
  }
  if (t >= 7.6) G.black = 1;
  if (t >= G.ending.dur){
    G.ending = null;
    gameOver('You had nothing left for him.', true);
  }
}
function heartGaveOut(){
  beginEnding('dead', 1.9);
  G.shake = 1.4;
  music.stop();
}
function devilDies(){
  var d = G.devil;
  d.dying = true; d.dieT = 0;
  beginEnding('devil', 2.8);
  G.white = 1; G.shake = 1.6;
  music.stop();
  sfx.kill();
  sfx.roar();
}
function updateEnding(dt){
  var E = G.ending, d = G.devil;
  E.t += dt;
  if (E.kind === 'taken'){ updateTaken(dt); return; }
  if (d && !d.dying){ d.sway += dt; d.x = LW/2 + Math.sin(d.sway * 0.55) * d.swayAmp; }
  if (E.kind === 'devil'){
    d.dieT = E.t;
    G.shake = Math.max(G.shake, 0.5);
    if (Math.random() < 0.35)
      burst(d.x + rnd(-110,110), d.y + rnd(-70,100), Math.random()<0.5 ? COLORS.ember : COLORS.sulfur, 2, 220, 60);
    if (E.t > E.dur - 0.3 && !d.dead){ d.dead = true; G.white = 1; burst(d.x, d.y, COLORS.bone, 30, 420, 0); }
  }
  if (E.t >= E.dur){

    else gameOver('Your heart gave out.');
  }
}
function gameOver(why, quiet){
  G.mode = 'over';

  G.score = Math.floor(G.score);
  if (G.score > hi){ hi = G.score; saveHi(); }
  document.getElementById('over-why').textContent = why;
  scrOver.classList.toggle('low', !!quiet);
  document.getElementById('over-score').textContent = 'Score ' + G.score;
  document.getElementById('over-hi').textContent = 'Best ' + hi;
  scrOver.hidden = false;
  if (!quiet) sfx.over();
  setTimeout(function(){ if (G.mode === 'over'){ AUDIO.muffle(false); G.heart.override = -1; music.play('dirge'); } }, quiet ? 2500 : 1000);
}
function victory(){
  G.mode = 'won';
  G.endT = 0;
  var spare = G.ammo;
  G.score = Math.floor(G.score + 10000 + G.lives * 2500 + spare * 1500);
  if (G.score > hi){ hi = G.score; saveHi(); }
  document.getElementById('win-why').textContent = spare
    ? ('Two eyes. ' + spare + ' bolt' + (spare > 1 ? 's' : '') + ' to spare.')
    : 'Two eyes. Not a bolt to spare.';
  document.getElementById('win-score').textContent = 'Score ' + G.score;
  document.getElementById('win-hi').textContent = 'Best ' + hi;
  scrWin.hidden = false;
  sfx.win();
  setTimeout(function(){ if (G.mode === 'won') music.play('win'); }, 900);
}

// ---------- update ----------
function update(dt){
  applyTier();
  G.t += dt;
  G.shake = decay(G.shake, 3.4, dt);
  G.flash = decay(G.flash, 3, dt);
  G.white = decay(G.white, 2.2, dt);
  G.lightning = decay(G.lightning, 2.0, dt);
  G.recoil = decay(G.recoil, 8, dt);
  CTL.fire.press = decay(CTL.fire.press, 5, dt);
  // the knob springs home when let go
  if (!CTL.stick){ CTL.knobX = lerp(CTL.knobX, CTL.home.x, Math.min(1, dt * 14)); CTL.knobY = lerp(CTL.knobY, CTL.home.y, Math.min(1, dt * 14)); }
  if (G.herald > 0) G.herald -= dt;
  if (G.hold > 0) G.hold -= dt;
  if (G.devil) G.devil.kick = decay(G.devil.kick, 3, dt);
  updateHeart(dt);

  // embers rise faster as the phase darkens and with every beat
  var emberK = 1 + G.prog * 1.3 + 0.8 * G.heart.pulse + (G.phase === 'devil' ? 0.6 : 0);
  for (var i=0;i<G.embers.length;i++){
    var em = G.embers[i];
    em.y -= em.v * emberK * dt;
    em.x += Math.sin(G.t*1.5 + em.p) * 10 * dt;
    if (em.y < -6){ em.y = LH + 6; em.x = rnd(0, LW); }
  }
  stepParticles(dt);
  stepTexts(dt);
  for (var lf=G.loose.length-1; lf>=0; lf--){
    var L = G.loose[lf]; L.t += dt; L.x += L.vx * dt; L.y += L.vy * dt; L.vy += 520 * dt; L.rot += L.spin * dt;
    if (L.y > LH + 40 || L.t > 3) G.loose.splice(lf, 1);
  }
  if (G.mode === 'title'){
    for (var ti=0; ti<G.titleHearts.length; ti++){
      var th2 = G.titleHearts[ti];
      th2.y -= th2.v * dt; th2.x += Math.sin(G.t * 0.8 + th2.p) * 8 * dt;
      if (th2.y < -20){ th2.y = LH + 20; th2.x = rnd(20, LW-20); }
    }
  }
  if (G.arms) updateArms(dt);
  updateFireVoices();

  if (G.mode === 'ending'){
    updateEnding(dt);
    moveHazards(dt, false);
    return;
  }
  if (G.mode !== 'play'){ G.endT += dt; return; }

  var p = G.player;

  // penalties expire the moment the heart is vulnerable again
  if (G.invuln > 0) G.invuln -= dt;
  if (G.penalty){
    G.penalty.t += dt;
    if (G.invuln <= 0){
      if (G.embed) releaseFork();
      G.penalty = null;
    }
  }
  // movement. embedded: slow, dragging the fork. burnt: fast and twitchy.
  var pen = G.penalty ? G.penalty.kind : '';
  var sp = 265 * (pen === 'fork' ? 0.65 : (pen === 'burn' ? 1.15 : 1)), mx = 0, my = 0;
  if (keys['arrowleft'] || keys['a']) mx -= 1;
  if (keys['arrowright']|| keys['d']) mx += 1;
  if (keys['arrowup']   || keys['w']) my -= 1;
  if (keys['arrowdown'] || keys['s']) my += 1;
  // the joystick: an analog vector, |joy| <= 1, so the same speed and the
  // same penalties as the keys with no special case
  mx += CTL.joy.x; my += CTL.joy.y;
  if (pen === 'burn' && (mx || my)){ mx += rnd(-0.45, 0.45); my += rnd(-0.45, 0.45); }
  if (mx || my){
    var m = Math.hypot(mx,my);
    if (m > 1){ mx /= m; my /= m; }             // keys on a diagonal: no faster
    p.x += mx * sp * dt;
    p.y += my * sp * dt;
    G.idleT = 0;
  } else if (!CTL.stick){
    G.idleT += dt;
    if (G.idleT > 3 && !G.heart.flutterDue){ G.heart.flutterDue = true; G.idleT = -2; }   // it flutters, then waits again
  }
  if (G.embed){ p.x += G.embed.dir.x * 18 * dt; p.y += G.embed.dir.y * 18 * dt; }
  p.x = clamp(p.x, 16, LW-16);
  p.y = clamp(p.y, ceilingY(), LH-30);
  // smoothed velocity, so the forks can lead you
  if (dt > 0){
    p.vx = lerp(p.vx, (p.x - p.px) / dt, Math.min(1, dt * 12));
    p.vy = lerp(p.vy, (p.y - p.py) / dt, Math.min(1, dt * 12));
  }
  p.px = p.x; p.py = p.y;

  // firing
  G.fireCd -= dt;
  if (fireQueued){ fireQueued = false; if (G.invuln < 1.4) fire(); }

  // bolts
  for (var i=G.bolts.length-1;i>=0;i--){
    var b = G.bolts[i];
    b.y += b.vy * dt;
    if (G.devil && (G.devil.state === 'open' || G.devil.state === 'attack')){
      var d = G.devil, ey = d.y + 4;
      if (b.y <= ey + 17 && b.y > ey - 40 && Math.abs(b.x - d.x) < d.w * 0.42){
        // reached the brow line: an eye, or the bone between them
        var struck = null;
        for (var k=0;k<d.eyes.length;k++){
          var e = d.eyes[k];
          if (!e.dead && Math.abs(b.x - (d.x + e.dx)) < 22){ struck = e; break; }
        }
        G.bolts.splice(i,1);
        if (struck && struck.open) eyeHit(d, struck);
        else if (struck) boltWasted(b, 'NOT YET');
        else boltWasted(b, 'WASTED');
        continue;
      }
    }
    if (b.y < -24){ G.bolts.splice(i,1); boltLost(b); }
  }
  if (G.mode !== 'play') return;   // a bolt may have ended the game

  // phase logic
  if (G.phase === 'survive'){
    G.surv += dt;
    G.score += dt * 10;
    var prog = G.prog = G.surv / G.SURV;
    music.whisper(prog > 0.7 ? (prog - 0.7) / 0.3 : 0);

    // twice, his eyes open in the dark and watch. Nothing else happens.
    if (G.watch){
      G.watch.t += dt;
      if (G.watch.t > G.watch.dur) G.watch = null;
    } else if ((G.watched === 0 && prog > 0.33) || (G.watched === 1 && prog > 0.68)){
      G.watched++;
      G.watch = { t: 0, dur: 1.3 };
      sfx.watch();
    }

    if (!G.watch){
      G.forkT -= dt;
      if (G.forkT <= 0){
        G.forkT = rnd(1.9, 2.7) - prog * 0.8;
        if (mayspawn()){
          var r = Math.random();
          throwFork(prog > 0.45 && r < 0.2 ? 'bracket' : (prog > 0.3 && r < 0.42 ? 'fan' : 'single'));
        }
      }
      G.walkT -= dt;
      if (G.walkT <= 0){ G.walkT = rnd(3.6, 5.2) - prog * 1.6; if (mayspawn()) spawnWalker(); }
      // side jets: none in the first 40 %, then one every 7 s, 4.5 s in the last quarter
      if (prog > 0.4){
        G.jetT -= dt;
        if (G.jetT <= 0){
          var jetEvery = prog < 0.75 ? 7 : lerp(7, 4.5, (prog - 0.75) / 0.25);
          G.jetT = (mayspawn() && spawnJet()) ? jetEvery : 0.3;
        }
      }
      if (prog > 0.25){
        G.emberT -= dt;
        if (G.emberT <= 0){ G.emberT = rnd(2.3, 3.4) - prog * 0.6; if (mayspawn()) spawnEmber(); }
      }
    }

    if (G.surv >= G.SURV){
      // silence. the heart skips. then he lands.
      G.phase = 'devil';
      G.prog = 1;
      G.devil = makeDevil();
      G.hold = 1.4;
      music.stop(0.5);
      music.whisper(0);
      G.forks.length = 0;
    }
  } else if (G.devil){
    updateDevil(dt);
    if (G.mode !== 'play') return;
    var ds = G.devil.state;
    if (ds === 'open' || ds === 'attack'){
      G.jetT -= dt;
      if (G.jetT <= 0){ G.jetT = spawnJet() ? rnd(2.2, 2.8) : 0.3; }
    }
    // lightning
    if (G.devil.state !== 'wait'){
      G.lightT -= dt;
      if (G.lightT <= 0){
        G.lightning = 1;
        G.lightT = rnd(6, 12);
        G.boltPath = makeLightning();
        sfx.thunder();
      }
    }
  }

  moveHazards(dt, true);
}

function forkHazardPos(f){
  return f.state === 'stuck' ? { x: f.x, y: f.y - 8 } : { x: f.x, y: f.y };
}
function moveHazards(dt, live){
  var p = G.player;

  // forks
  for (var i=G.forks.length-1;i>=0;i--){
    var f = G.forks[i];
    f.t += dt;
    if (f.t < 0) continue;                 // waiting its turn in a volley
    if (f.state === 'aim'){
      if (f.track){
        f.tx = clamp(p.x + p.vx * 0.35, 16, LW-16);
        f.ty = clamp(p.y + p.vy * 0.35, ceilingY(), LH-30);
      }
      f.rot = Math.atan2(f.ty - f.oy, f.tx - f.ox) - Math.PI/2;
      if (f.t >= f.aimT){ f.state = 'lock'; f.t = 0; sfx.lock(); }
    } else if (f.state === 'lock'){
      if (f.t >= f.lockT){
        var ang = Math.atan2(f.ty - f.oy, f.tx - f.ox) + f.spread;
        f.vx = Math.cos(ang) * FORK_SPEED; f.vy = Math.sin(ang) * FORK_SPEED;
        f.rot = ang - Math.PI/2;
        f.state = 'fly'; f.t = 0;
        sfx.throwFork();
      }
    } else if (f.state === 'fly'){
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.y >= FLOOR - 6){
        f.y = FLOOR - 6; f.state = 'stuck'; f.t = 0; f.baseRot = f.rot;
        burst(f.x, FLOOR, '#ff6a1f', 3, 90);
        sfx.impact(f.x, false);
      } else if (f.x < -30 || f.x > LW + 30 || f.y < -60){
        if (f.y > 0 && f.y < LH) sfx.impact(clamp(f.x, 0, LW), true);   // into the wall
        G.forks.splice(i,1); continue;
      }
    } else {   // stuck: quivers, then burns out
      f.rot = f.baseRot + Math.sin(f.t * 42) * 0.14 * Math.max(0, 1 - f.t / 1.2);
      if (f.t > 1.5){ G.forks.splice(i,1); continue; }
    }

    // bolts can still break one
    var hit = false;
    for (var j=G.bolts.length-1;j>=0;j--){
      var bb = G.bolts[j];
      if (Math.abs(bb.x - f.x) < f.r + 5 && Math.abs(bb.y - f.y) < f.r + 12){
        G.bolts.splice(j,1);
        G.forks.splice(i,1);
        G.score += 100;
        burst(f.x, f.y, '#ff6a1f', 6, 180);
        addText(f.x, f.y - 10, '+100', COLORS.ash, 0.6, 7);
        sfx.pop();
        hit = true;
        checkAmmo();
        break;
      }
    }
    if (hit || !live || G.mode !== 'play') continue;
    if (f.state !== 'fly' && f.state !== 'stuck') continue;
    var hp = forkHazardPos(f);
    if (hits(p, hp.x, hp.y, f.r)){ hurt('fork', hp.x, hp.y, f.vx || 0, f.vy || 1); break; }   // hurt() clears the forks
    // graze: a near miss pays
    if (f.state === 'fly' && !f.grazed && G.invuln <= 0 && Math.hypot(p.x - f.x, p.y - f.y) < f.r + 8 + 16){
      f.grazed = true;
      G.score += 50;
      addText(p.x, p.y - 26, '+50', COLORS.sulfur, 0.6, 7);
      sfx.graze();
    }
  }

  // fire
  for (var i=G.flames.length-1;i>=0;i--){
    var fl = G.flames[i];
    fl.t += dt;
    var burn = false, burnAt = null;
    if (fl.type === 'walker'){
      fl.age += dt;
      fl.hmax = Math.min(fl.hmax, flameLimit());          // the ceiling can drop mid-life (his arrival)
      if (fl.state !== 'die') fl.h = fl.hmax * smooth(Math.min(1, fl.age / 0.8));   // the danger visibly climbs
      if (fl.state === 'walk'){
        // toward the x locked at ignition, then it stops. It never re-aims.
        var dxw = fl.targetX - fl.x;
        if (Math.abs(dxw) <= 100 * dt){ fl.x = fl.targetX; fl.state = 'stand'; }
        else fl.x += Math.sign(dxw) * 100 * dt;
        if (live && Math.abs(p.x - fl.x) < 14){ fl.state = 'erupt'; fl.t = 0; sfx.erupt(fl.x); G.shake = Math.max(G.shake, 0.6); }
      } else if (fl.state === 'erupt'){
        fl.flare = 1 - fl.t / 0.7;                            // a flare, not a climb: the height limit holds
        if (fl.t > 0.7){ fl.state = 'stand'; fl.flare = 0; }
      }
      if (fl.state !== 'die' && fl.age > 6){ fl.state = 'die'; fl.t = 0; sfx.crackle(fl.x); }
      if (fl.state === 'die'){
        fl.h -= 420 * dt;
        if (fl.h <= 0){ G.flames.splice(i,1); continue; }
      }
      // embers shed from the top and drift up on the turbulence
      if (fl.h > 30 && Math.random() < 0.4)
        addPart({ x: fl.x + rnd(-fl.w*0.3, fl.w*0.3), y: LH - fl.h + rnd(-6, 24), vx: rnd(-12, 12), vy: rnd(-70, -30),
                       life: rnd(0.7, 1.5), t: 0, c: Math.random() < 0.5 ? '#ffb060' : '#ff7a10', r: rnd(1.2, 2.4), g: -26, turb: 60 });
      burn = Math.abs(p.x - fl.x) < fl.w * (0.5 + 0.2 * fl.flare) + 4 && p.y > LH - fl.h - 6;
      if (burn) burnAt = [fl.x, p.y + 20];
    } else if (fl.type === 'ember'){
      if (fl.state === 'fly'){
        fl.x += fl.vx * dt; fl.y += fl.vy * dt; fl.rot += fl.spin * dt;
        // embers shed off the tail
        if (Math.random() < 0.6){
          var bv = Math.hypot(fl.vx, fl.vy) || 1;
          addPart({ x: fl.x - fl.vx / bv * rnd(8, 26) + rnd(-4, 4), y: fl.y - fl.vy / bv * rnd(8, 26) + rnd(-4, 4),
                         vx: -fl.vx * 0.08 + rnd(-20, 20), vy: -fl.vy * 0.08 + rnd(-30, 0), life: rnd(0.4, 0.9), t: 0,
                         c: Math.random() < 0.5 ? '#ffb060' : '#ff7a10', r: rnd(1, 2.2), g: -20, turb: 40 });
        }
        var remaining = Math.hypot(fl.tx - fl.x, fl.ty - fl.y);
        if (remaining < 430 * dt * 1.1){
          fl.x = fl.tx; fl.y = fl.ty; fl.state = 'ring'; fl.t = 0;
          burst(fl.tx, fl.ty, '#ff7a10', 6, 140);
          if (live) sfx.emberLand();
        }
        burn = Math.hypot(p.x - fl.x, p.y - fl.y) < 11 + 8;
        if (burn) burnAt = [fl.x, fl.y];
      } else if (fl.state === 'ring'){
        // scorched into the floor: brightens and contracts, then goes off
        if (fl.t > fl.fuse){
          fl.state = 'bloom'; fl.t = 0; burst(fl.tx, fl.ty, '#ffb060', 8, 200);
          if (live){ sfx.bloom(fl.tx); G.shake = Math.max(G.shake, 1.1 * (1 - clamp(Math.hypot(p.x - fl.tx, p.y - fl.ty) / 320, 0, 1))); }
        }
      } else {
        if (fl.t > 0.8){ G.flames.splice(i,1); continue; }
        if (fl.t < 0.5){
          var br = 10 + 24 * Math.min(1, fl.t / 0.12);
          burn = Math.hypot(p.x - fl.tx, p.y - fl.ty) < br + 6;
          if (burn) burnAt = [fl.tx, fl.ty];
        }
      }
    } else if (fl.type === 'jet'){
      if (fl.state === 'aim'){
        if (live){ fl.tx = p.x; fl.ty = p.y; }          // tracks, then freezes at lock: not led
        if (fl.t >= fl.aimT){
          fl.state = 'lock'; fl.t = 0;
          var adx = Math.max(1, Math.abs(fl.tx - fl.ox)), ady = fl.oy - fl.ty;
          fl.ang = clamp(Math.atan2(ady, adx), 15 * Math.PI/180, 35 * Math.PI/180);
          sfx.lock();
        }
      } else if (fl.state === 'lock'){
        if (fl.t >= fl.lockT){ fl.state = 'fire'; fl.t = 0; if (live) sfx.jet(); G.shake = Math.max(G.shake, 0.3); }
      } else if (fl.state === 'fire'){
        if (fl.t >= 0.3){ fl.state = 'hold'; fl.t = 0; }
      } else if (fl.state === 'hold'){
        if (fl.t >= 0.5){ fl.state = 'retract'; fl.t = 0; }
      } else if (fl.t >= 0.3){ G.flames.splice(i,1); continue; }
      fl.len = jetLen(fl);
      if (fl.len > 0){
        var jd2 = jetDir(fl);
        burn = distToSeg(p.x, p.y, fl.ox, fl.oy, fl.ox + jd2.x * fl.len, fl.oy + jd2.y * fl.len) < 20 + 6;
        if (burn) burnAt = [p.x + jd2.x * -20, p.y + jd2.y * -20];
      }
    } else if (fl.type === 'breath'){
      if (fl.t > fl.warn + fl.burn){ G.flames.splice(i,1); continue; }
      if (fl.t > fl.warn && !fl.roared){ fl.roared = true; sfx.breath(); G.shake = Math.max(G.shake, 0.6); }
      if (fl.t > fl.warn && fl.t < fl.warn + fl.burn * 0.85){
        burn = (p.x < LW/2 ? -1 : 1) === fl.side;
        if (burn) burnAt = [p.x, p.y - 60];
      }
    }
    if (live && burn) hurt('burn', burnAt ? burnAt[0] : p.x, burnAt ? burnAt[1] : p.y - 40);
  }
}

// every burning thing gets a voice, louder when tall and near the heart
var flameSeq = 0;
function updateFireVoices(){
  var p = G.player, list = [];
  G.flames.forEach(function(fl){
    if (!fl.id) fl.id = ++flameSeq;
    if (fl.type === 'walker' && fl.h > 10) list.push({ id: fl.id, x: fl.x, h: Math.min(1, fl.h / 380), dist: Math.hypot(Math.max(0, Math.abs(p.x - fl.x) - fl.w/2), Math.max(0, (LH - fl.h) - p.y)) });
    else if (fl.type === 'jet' && fl.len > 0){ var jd = jetDir(fl); list.push({ id: fl.id, x: fl.ox + jd.x * fl.len * 0.5, h: fl.len / 450, dist: distToSeg(p.x, p.y, fl.ox, fl.oy, fl.ox + jd.x * fl.len, fl.oy + jd.y * fl.len) }); }
    else if (fl.type === 'breath' && fl.t > fl.warn && fl.t < fl.warn + fl.burn) list.push({ id: fl.id, x: LW/2 + fl.side * 105, h: 1, dist: (p.x < LW/2 ? -1 : 1) === fl.side ? 0 : 220 });
  });
  AUDIO.fire.update(list);
}
function stepParticles(dt){
  for (var i=G.parts.length-1;i>=0;i--){
    var q = G.parts[i];
    q.t += dt;
    if (q.t > q.life){ G.parts.splice(i,1); continue; }
    if (q.turb){
      var c = FIRE.curl(q.x * 0.6, q.y * 0.6 + G.t * 30);
      q.vx += c.x * q.turb * dt * 20; q.vy += c.y * q.turb * dt * 20;
      q.vx *= 1 - dt * 1.5;
    }
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.vy += q.g * dt;
  }
}
function stepTexts(dt){
  for (var i=G.texts.length-1;i>=0;i--){
    var tx = G.texts[i];
    tx.t += dt;
    tx.y -= 18 * dt;
    if (tx.t > tx.life) G.texts.splice(i,1);
  }
}

function hits(p, x, y, r){
  if (G.invuln > 0) return false;
  return Math.hypot(p.x - x, p.y - y) < r + 8;
}

// kind: 'fork' (a pitchfork embeds), 'burn' (fire clings), or nothing.
// hx, hy: where it came from, for the struck side and the fork's angle.
function hurt(kind, hx, hy, vx, vy){
  if (G.invuln > 0 || G.mode !== 'play') return;
  var p = G.player;
  G.lives--;
  G.invuln = 2.0;
  G.shake = 1.1;
  G.flash = 1;
  burst(p.x, p.y, COLORS.bone, 14, 260);
  sfx.hurt();
  G.forks.length = 0;
  // the beat stops dead, restarts with a hard irregular thump, then arrhythmia;
  // and it sheds light it will not get back
  var h = G.heart;
  h.stop = 0.2; h.big = true; h.arr = 2.0; h.next = h.since + rnd(0.05, 0.25);
  h.light = Math.max(0.35, h.light - 0.22);
  for (var li=0; li<16; li++)
    addPart({ x: p.x, y: p.y, vx: rnd(-90, 90), vy: rnd(-120, 20), life: rnd(0.5, 1.1), t: 0,
                   c: Math.random() < 0.5 ? COLORS.heart : '#ffffff', r: rnd(1, 2.6), g: -10, turb: 30 });
  if (G.arms) G.arms.creep = Math.max(0, 3 - G.lives);
  // the penalty, and the scar it leaves
  var dx = (hx == null ? 0 : hx - p.x), dy = (hy == null ? -1 : hy - p.y), dl = Math.hypot(dx, dy) || 1;
  var dir = { x: dx / dl, y: dy / dl };
  if (kind === 'fork'){
    var vl = Math.hypot(vx || 0, vy || 0) || 1, tdir = { x: (vx || 0) / vl, y: (vy || 1) / vl };
    G.penalty = { kind: 'fork', t: 0, dir: tdir };
    G.embed = { ang: Math.atan2(tdir.y, tdir.x) - Math.PI/2, dir: tdir, t: 0 };
    // a crack running in from the wound
    var ex = -tdir.x * 0.8, ey = -tdir.y * 0.8, pts = [];
    for (var ci=0; ci<5; ci++){ var u = ci/4; pts.push([ex + (0.15 - ex) * u + (ci && ci < 4 ? rnd(-0.18, 0.18) : 0), ey + (0.1 - ey) * u + (ci && ci < 4 ? rnd(-0.18, 0.18) : 0)]); }
    G.scars.push({ kind: 'crack', pts: pts });
  } else if (kind === 'burn'){
    if (G.embed){ burnAwayFork(); }
    G.penalty = { kind: 'burn', t: 0, dir: dir };
    G.scars.push({ kind: 'char', x: dir.x * 0.5 + rnd(-0.15, 0.15), y: dir.y * 0.5 + rnd(-0.15, 0.15), r: rnd(0.28, 0.42), seed: Math.random() });
  } else G.penalty = { kind: 'hit', t: 0, dir: dir };
  if (G.lives <= 0){
    burst(p.x, p.y, COLORS.ember, 20, 320);
    heartGaveOut();
  }
}
// the fork works loose and tumbles away
function releaseFork(){
  var em = G.embed, p = G.player; G.embed = null;
  G.loose.push({ x: p.x, y: p.y, vx: em.dir.x * 60 + rnd(-40, 40), vy: -120 + rnd(-30, 30), rot: em.ang, spin: rnd(-6, 6), t: 0 });
  sfx.stick();
}
// burnt while embedded: the fork burns away early
function burnAwayFork(){
  var p = G.player; G.embed = null;
  burst(p.x, p.y, '#ff7a10', 10, 160);
}

// ---------- devil behaviour ----------
function updateDevil(dt){
  var d = G.devil, p = G.player;
  d.st += dt;

  }

    d.mouth = d.st < L ? 0.35 + 0.6 * lb : Math.min(1, d.mouth + dt * 4);
    d.mouthGlow = d.st < L - 0.35 ? 0 : (d.st < L ? (d.st - (L - 0.35)) / 0.35 : Math.max(0, 1 - (d.st - L) / 0.3));

      G.shake = 1.6; G.inferno = true;
      sfx.volley(); sfx.roar();
    }
    if (d.st > L + 0.8){
      d.mouth = Math.max(0, 1 - (d.st - (L + 0.8)) / 0.3);
    }
    if (d.st > L + 1.2){
      d.mouth = 0;
      if (G.ammo + G.bolts.length === 0) d.takeIn = 0.8;   // he can see you have nothing
      startAttack(d);
    }
    return;
  }

  if (d.state === 'open'){
    // no new hazards while he's exposed: the window is about aim, not luck
    var window_ = 1.9 - d.rage * 0.3;

    if (st > 1.2 && !d.embered){ d.embered = true; spawnEmber(d.x, d.y + 70); }

}
// the mouth follows the laugh's five bursts
function laughBurst(st){

  return k;
}
var ATTACKS = ['volley', 'breath', 'claw', 'beams', 'fire'];
function startAttack(d){

  d.thrown = 0; d.fired = false; d.embered = false; d.mouth = 0;
  if (d.attack === 'breath') spawnBreath(G.player.x < LW/2 ? -1 : 1);
  if (d.attack === 'claw'){

function makeLightning(){
  var pts = [], x = rnd(40, LW-40), y = -10;
  var tx = G.devil ? G.devil.x + (Math.random()<0.5 ? -1 : 1) * G.devil.w*0.4 : LW/2;
  var ty = G.devil ? G.devil.y - G.devil.h*0.6 : 120;

// how much fire is under the heart right now, 0..1
function fireBelow(p){ return fireLight(p.x, p.y).k; }
// how much fire light falls on a point, and from which direction (unit vector toward the fire)
function fireLight(x, y){
  var best = { k: 0, dx: 0, dy: 1 };
  G.flames.forEach(function(fl){
    var nx, ny, kk;
    if (fl.type === 'walker' && fl.h > 20){
      nx = clamp(x, fl.x - fl.w * 0.5, fl.x + fl.w * 0.5); ny = clamp(y, LH - fl.h, LH);
      kk = 1 - clamp(Math.hypot(x - nx, y - ny) / 170, 0, 1);
    } else if (fl.type === 'jet' && fl.len > 0){
      var jd = jetDir(fl), ex = fl.ox + jd.x * fl.len, ey = fl.oy + jd.y * fl.len;
      var vx = ex - fl.ox, vy = ey - fl.oy, L2 = vx*vx + vy*vy || 1, kseg = clamp(((x - fl.ox) * vx + (y - fl.oy) * vy) / L2, 0, 1);

      kk = 0.8 * (1 - clamp(Math.hypot(x - nx, y - ny) / 150, 0, 1));
    } else return;
    if (kk > best.k){
      var d = Math.hypot(nx - x, ny - y) || 1;

function drawFlame(fl){

// a fireball in flight: white-hot core, orange body, a tail streaming

function drawFireball(f){
