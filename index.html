<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Beat the Devil</title>
<!-- the heart, in its own light, on the void: an inline SVG so the host never has to serve a favicon file -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0620'/%3E%3Cpath d='M16 27 C8 21 4 17 4 12 a6 6 0 0 1 12-2 a6 6 0 0 1 12 2 c0 5-4 9-12 15z' fill='%239fe8ff'/%3E%3Cpath d='M16 27 C8 21 4 17 4 12 a6 6 0 0 1 12-2 a6 6 0 0 1 12 2 c0 5-4 9-12 15z' fill='none' stroke='%23fdf8f0' stroke-width='1.2' opacity='.7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>
<div id="wrap">
  <div id="monitor">
    <div id="stage">
      <canvas id="c" aria-label="Beat the Devil arcade game"></canvas>

      <div class="screen" id="scr-title">
        <div class="banner">AN ARCADE NIGHTMARE</div>
        <div class="title">BEAT<br>THE DEVIL</div>
        <div class="sub" id="tip">Arrow keys or A / D to move<br>Hold space to fire<br><br>Survive the pitchforks and the fire.<br>Then put a bolt through<br>each of his eyes.</div>
        <div class="blink" id="start-hint">Press space to start</div>
        <div class="stat" id="hi-title"></div>
      </div>

      <div class="screen" id="scr-over" hidden>
        <div class="big lose">HE TOOK IT</div>
        <div class="sub why" id="over-why"></div>
        <div class="stat" id="over-score"></div>
        <div class="stat" id="over-hi"></div>
        <div class="blink" id="over-hint">Press space to try again</div>
      </div>

      <div class="screen" id="scr-win" hidden>
        <div class="big">YOU BEAT<br>THE DEVIL</div>
        <div class="sub why" id="win-why"></div>
        <div class="stat" id="win-score"></div>
        <div class="stat" id="win-hi"></div>
        <div class="blink" id="win-hint">Press space to play again</div>
      </div>

      <button id="mute" type="button">Sound on</button>
    </div>
    <div id="vents" aria-hidden="true"></div>
    <div id="panel" aria-hidden="true">
      <div id="badge">
        <span class="mark" aria-hidden="true"></span>
        <span class="word">beat the devil</span>
        <span class="stripes" aria-hidden="true"></span>
      </div>
      <div id="door">
        <div class="knob"></div><div class="knob"></div><div class="knob"></div><div class="knob"></div>
      </div>
      <div id="power"><div id="led"></div></div>
    </div>
  </div>
</div>

<script src="audio.js?v=18"></script>
<script src="game.js?v=18"></script>
</body>
</html>
